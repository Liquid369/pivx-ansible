# host_vars/tn6-ovh1.yml
#
# OVH, Sydney AU (ap-southeast-syd)
# Plan class: contabo_6vcpu
# 10 PIVX masternode instances (2 IPv4-port-split, 6 IPv6, 2 Tor).
# OVH routes the whole /64, so the IPv6 slots scale here for free;
# Contabo is capped at ::1/::2 and stays at 2.
#
# Single IPv4 per host, so mn02 shares it on a different P2P port
# (uniqueness is on ip:port). OVH configures IPv6 as /128 with an
# off-subnet gateway, so ::2 needs the gateway pinned on-link or it has
# no route out - hence host_ipv6_prefixlen and host_ipv6_gateway below.
# Unlike Contabo, OVH does not block direct L2 between hosts.

provider: ovh
provider_plan: ovh_syd
chaos_group: chaos_ovh
node_role: masternode
host_label: tn6-ovh1
pivx_instances_expected: 15

host_ipv4:   "139.99.130.196"
host_ipv4_2: "139.99.130.196"    # single IPv4 — shared, mn02 uses port 51484

# Additional IPv4 (OVH failover IPs). Routed to this server at OVH's edge
# and NOT announced to the OS in any way, so they are configured as /32
# here from the OVH manager listing. They are in an unrelated range to the
# primary: that /24 is shared infrastructure and its .254 is the gateway,
# so neighbouring addresses are never ours to take.
#
# Every address is verified to accept inbound TCP on 51474 from outside the
# provider before being counted — ping alone does not prove a masternode
# can be dialled.
#
# All of these sit in one /16, so peer selection treats them as a single
# netgroup (net.cpp:1807 allows one outbound per group). They add to the
# masternode count; they do not multiply organic inbound.
host_ipv4_extra:
  - "51.161.143.181"
  - "51.161.156.162"
  - "51.161.156.163"
  - "51.161.156.164"
  - "51.161.156.165"
  - "51.161.156.166"
host_ipv6:   "2402:1f00:8100:2c4::1"
host_ipv6_2: "2402:1f00:8100:2c4::2"
host_ipv6_3:   "2402:1f00:8100:2c4::3"
host_ipv6_4:   "2402:1f00:8100:2c4::4"
host_ipv6_5:   "2402:1f00:8100:2c4::5"
host_ipv6_6:   "2402:1f00:8100:2c4::6"

# OVH routes the whole /64, so the IPv6 cohort scales here at no cost.
# Contabo is capped at ::1/::2, which is why only the OVH hosts carry these.
host_ipv6_extra:
  - "{{ host_ipv6_3 }}"
  - "{{ host_ipv6_4 }}"
  - "{{ host_ipv6_5 }}"
  - "{{ host_ipv6_6 }}"

host_ipv6_prefixlen: 128
host_ipv6_gateway: "2402:1f00:8100:2ff:ff:ff:ff:ff"

# Firewall: open all PIVX P2P slots used by this host.
ufw_pivx_ports:
  - "{{ pivx_p2p_port_base }}"
  - "{{ pivx_p2p_port_base + 10 }}"
  - "{{ pivx_p2p_port_base + 20 }}"
  - "{{ pivx_p2p_port_base + 30 }}"
  - "{{ pivx_p2p_port_base + 40 }}"
  - "{{ pivx_p2p_port_base + 50 }}"

pivx_instances:

  - name: tn6-ovh1-v4-mn01
    enabled: true
    slot: 0
    protocol_class: ipv4
    cohort: ipv4
    role: masternode
    bind_addr: "{{ host_ipv4 }}"
    external_ip: "{{ host_ipv4 }}"
    p2p_port: 51474
    rpc_port: 51478
    rpc_user: rpc_v4mn01
    rpc_password: "{{ vault_pivx_rpc_password }}"
    datadir: "/var/lib/pivx/tn6-ovh1-v4-mn01"
    logdir: "/var/log/pivx/tn6-ovh1-v4-mn01"
    confdir: "/etc/pivx/tn6-ovh1-v4-mn01"
    mining_enabled: false
    staking_enabled: false       # set true in Phase 3 once coins arrive
    masternode_enabled: false    # set true in Phase 4 after DMN registration
    bls_operator_key: "REPLACE_ME"
    extra_conf: []

  - name: tn6-ovh1-v4-mn02
    enabled: true
    slot: 1
    protocol_class: ipv4
