    rpc_password: "{{ vault_pivx_rpc_password }}"
    datadir: "/var/lib/pivx/tn6-ovh1-v4-mn02"
    logdir: "/var/log/pivx/tn6-ovh1-v4-mn02"
    confdir: "/etc/pivx/tn6-ovh1-v4-mn02"
    mining_enabled: false
