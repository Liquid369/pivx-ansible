# host_vars/tn6-cb2.yml
#
# Contabo Cloud VPS 8 (2026), US St. Louis
# Plan class: contabo_8vcpu
# 6 PIVX masternode instances (2 IPv4-port-split, 2 IPv6, 2 Tor) + colocated seed02/bootstrap-miner (slot 6).
#
# NOTE: Contabo provides a single IPv4 per VPS. mn02 shares the IPv4 on a
# different P2P port (valid for testnet DMNs: uniqueness is on ip:port).
# The IPv6 /64 provides ::1 (stock) and ::2 (added via netplan drop-in).

provider: contabo
provider_plan: contabo_8vcpu
chaos_group: chaos_contabo
node_role: mixed_masternode_seeder
host_label: tn6-cb2
pivx_instances_expected: 7

host_ipv4:   "62.146.176.174"
host_ipv4_2: "62.146.176.174"    # single IPv4 — shared, mn02 uses port 51484
host_ipv6:   "2605:a140:2346:5863::1"
host_ipv6_2: "2605:a140:2346:5863::2"   # added by common role netplan drop-in

# Firewall: open all PIVX P2P slots used by this host.
ufw_pivx_ports:
  - "{{ pivx_p2p_port_base }}"
  - "{{ pivx_p2p_port_base + 10 }}"
  - "{{ pivx_p2p_port_base + 20 }}"
  - "{{ pivx_p2p_port_base + 30 }}"
  - "{{ pivx_p2p_port_base + 40 }}"
  - "{{ pivx_p2p_port_base + 50 }}"
  - "{{ pivx_p2p_port_base + 60 }}"

pivx_instances:

  - name: tn6-cb2-v4-mn01
    enabled: true
    slot: 0
    protocol_class: ipv4
    cohort: ipv4
    role: masternode
    bind_addr: "{{ host_ipv4 }}"
    external_ip: "{{ host_ipv4 }}"
    p2p_port: 51474
    rpc_port: 51478
    rpc_user: rpc_v4mn01
    rpc_password: "{{ vault_pivx_rpc_password }}"
    datadir: "/var/lib/pivx/tn6-cb2-v4-mn01"
    logdir: "/var/log/pivx/tn6-cb2-v4-mn01"
    confdir: "/etc/pivx/tn6-cb2-v4-mn01"
    mining_enabled: false
    staking_enabled: false       # set true in Phase 3 once coins arrive
    masternode_enabled: false    # set true in Phase 4 after DMN registration
    bls_operator_key: "REPLACE_ME"
    extra_conf: []

  - name: tn6-cb2-v4-mn02
    enabled: true
    slot: 1
    protocol_class: ipv4
    cohort: ipv4
    role: masternode
    bind_addr: "{{ host_ipv4_2 }}"
    external_ip: "{{ host_ipv4_2 }}"
    p2p_port: 51484
    rpc_port: 51488
    rpc_user: rpc_v4mn02
    rpc_password: "{{ vault_pivx_rpc_password }}"
    datadir: "/var/lib/pivx/tn6-cb2-v4-mn02"
    logdir: "/var/log/pivx/tn6-cb2-v4-mn02"
    confdir: "/etc/pivx/tn6-cb2-v4-mn02"
    mining_enabled: false
    staking_enabled: false       # set true in Phase 3 once coins arrive
    masternode_enabled: false    # set true in Phase 4 after DMN registration
    bls_operator_key: "REPLACE_ME"
    extra_conf: []

  - name: tn6-cb2-v6-mn03
    enabled: true
    slot: 2
    protocol_class: ipv6
    cohort: ipv6
    role: masternode
    bind_addr: "[{{ host_ipv6 }}]"
    external_ip: "{{ host_ipv6 }}"
    p2p_port: 51494
    rpc_port: 51498
    rpc_user: rpc_v6mn03
    rpc_password: "{{ vault_pivx_rpc_password }}"
    datadir: "/var/lib/pivx/tn6-cb2-v6-mn03"
    logdir: "/var/log/pivx/tn6-cb2-v6-mn03"
    confdir: "/etc/pivx/tn6-cb2-v6-mn03"
    mining_enabled: false
    staking_enabled: false       # set true in Phase 3 once coins arrive
    masternode_enabled: false    # set true in Phase 4 after DMN registration
    bls_operator_key: "REPLACE_ME"
    extra_conf: []

  - name: tn6-cb2-v6-mn04
    enabled: true
    slot: 3
    protocol_class: ipv6
    cohort: ipv6
    role: masternode
    bind_addr: "[{{ host_ipv6_2 }}]"
    external_ip: "{{ host_ipv6_2 }}"
    p2p_port: 51504
    rpc_port: 51508
    rpc_user: rpc_v6mn04
    rpc_password: "{{ vault_pivx_rpc_password }}"
    datadir: "/var/lib/pivx/tn6-cb2-v6-mn04"
    logdir: "/var/log/pivx/tn6-cb2-v6-mn04"
    confdir: "/etc/pivx/tn6-cb2-v6-mn04"
    mining_enabled: false
    staking_enabled: false       # set true in Phase 3 once coins arrive
    masternode_enabled: false    # set true in Phase 4 after DMN registration
    bls_operator_key: "REPLACE_ME"
    extra_conf: []

  - name: tn6-cb2-tor-mn05
    enabled: true
    slot: 4
    protocol_class: tor
    cohort: tor
    role: masternode
    bind_addr: "127.0.0.1"
    external_ip: ""
    onion_address: "ahznq5kwpd6xwxfggg2ooy545ts2f72l7flu3rbcyxoog7fjjjd5j7ad.onion"
    onion_service_dir: "/var/lib/tor/pivx_hs/tn6-cb2-tor-mn05"
    p2p_port: 51514
    rpc_port: 51518
    rpc_user: rpc_tormn05
    rpc_password: "{{ vault_pivx_rpc_password }}"
    datadir: "/var/lib/pivx/tn6-cb2-tor-mn05"
    logdir: "/var/log/pivx/tn6-cb2-tor-mn05"
    confdir: "/etc/pivx/tn6-cb2-tor-mn05"
    mining_enabled: false
    staking_enabled: false       # set true in Phase 3 once coins arrive
    masternode_enabled: false    # set true in Phase 4 after DMN registration
    bls_operator_key: "REPLACE_ME"
    extra_conf: []

  - name: tn6-cb2-tor-mn06
    enabled: true
    slot: 5
    protocol_class: tor
    cohort: tor
    role: masternode
    bind_addr: "127.0.0.1"
    external_ip: ""
    onion_address: "k5q4d3edrpipl6tc4ky4g27vnuge23qutpkjxbcxkocb4bbet2zf3fyd.onion"
    onion_service_dir: "/var/lib/tor/pivx_hs/tn6-cb2-tor-mn06"
    p2p_port: 51524
    rpc_port: 51528
    rpc_user: rpc_tormn06
    rpc_password: "{{ vault_pivx_rpc_password }}"
    datadir: "/var/lib/pivx/tn6-cb2-tor-mn06"
    logdir: "/var/log/pivx/tn6-cb2-tor-mn06"
    confdir: "/etc/pivx/tn6-cb2-tor-mn06"
    mining_enabled: false
    staking_enabled: false       # set true in Phase 3 once coins arrive
    masternode_enabled: false    # set true in Phase 4 after DMN registration
    bls_operator_key: "REPLACE_ME"
    extra_conf: []

  - name: tn6-cb2-seed02
    enabled: true
    slot: 6
    protocol_class: ipv4
    cohort: ipv4
    role: seeder
    bind_addr: "{{ host_ipv4 }}"
    external_ip: "{{ host_ipv4 }}"
    p2p_port: 51534
    rpc_port: 51538
    rpc_user: rpc_seed02
    rpc_password: "{{ vault_pivx_rpc_password }}"
    datadir: "/var/lib/pivx/tn6-cb2-seed02"
    logdir: "/var/log/pivx/tn6-cb2-seed02"
    confdir: "/etc/pivx/tn6-cb2-seed02"
    mining_enabled: false        # keep off until the miner fix is verified on one seed, old binary looped on invalid blocks and filled the disk
    staking_enabled: false       # can be flipped true in Phase 3
    masternode_enabled: false    # seeders are bootstrap peers, not DMNs
    bls_operator_key: ""
    extra_conf:
      - "dnsseed=0"
      - "listenonion=0"
