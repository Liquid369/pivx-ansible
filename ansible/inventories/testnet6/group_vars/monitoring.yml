# group_vars/monitoring.yml
# Applies to the host(s) running the monitoring stack.

monitoring_stack_enabled: true

# Ports for monitoring services
prometheus_port: 9090
grafana_port: 3000
loki_port: 3100
alertmanager_port: 9093

# Grafana provisioning
grafana_admin_user: admin
grafana_admin_password: "{{ vault_grafana_admin_password }}"

# Data retention
prometheus_retention_time: 30d
# 30 days of logs reached 221GB and took this host to 84% of a 290GB disk, with
# Prometheus, Grafana, Alertmanager and 9 masternodes sharing it. Most of that
# came from the net and net_mn debug categories, which wrote 2071 lines a minute
# per instance until they were dropped on 2026-09-01; the fleet now writes 34.
# The backlog will not age out under a 30 day window until October, which is
# longer than the free space lasts.
#
# 14 days deletes the pre-September bulk now and still covers a fortnight. At
# the current rate it costs roughly 15-20GB. Raise it again once monitoring has
# a host of its own rather than sharing cb5.
loki_retention_period: 336h     # 14 days

# Grafana is published at https://grafana.liquid369.wtf through Cloudflare.
# nginx terminates TLS on 443 and proxies to Grafana on loopback; ufw admits
# only Cloudflare's published ranges. Cloudflare SSL mode must be "Full" —
# "Flexible" would leave the Cloudflare-to-origin hop in plaintext.
grafana_behind_proxy: true
grafana_public_hostname: "grafana.liquid369.wtf"
