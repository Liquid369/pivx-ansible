# group_vars/all/main.yml
# Global defaults for the entire Testnet6 fleet.
# Override in child group_vars or host_vars as needed.
#
# LIFECYCLE PHASES — set lifecycle_phase at runtime or in group_vars:
#   bootstrap_mining   Phase 2: fresh chain, designated miners running
#   pos_transition     Phase 3: mining tapering off, staking being enabled
#   staking            Phase 3b: PoS active, MN registration begins
#   masternode_quorum  Phase 4: full quorum/LLMQ testing
#   chaos_testing      Phase 5: active failure injection experiments

# ---------------------------------------------------------------------------
# Current lifecycle phase
# This var is read by roles and templates to conditionally enable behavior.
# Change it here (or override per-host/group) as the testnet advances.
# ---------------------------------------------------------------------------
lifecycle_phase: bootstrap_mining    # CHANGE as testnet progresses

# ---------------------------------------------------------------------------
# PIVX binary
# Versioned install layout:
#   /opt/pivx/releases/<version>/  — immutable per-version install
#   /opt/pivx/current              — symlink to active version
#   /opt/pivx/current/bin/pivxd    — what systemd units use
# ---------------------------------------------------------------------------
# Testnet6 has a fresh genesis so official release binaries will not run.
# We build from the 2026_testnet6 branch until the PR lands upstream.
pivx_version: "5.6.99-tn6.2"
pivx_releases_base: "/opt/pivx/releases"
pivx_install_dir: "{{ pivx_releases_base }}/{{ pivx_version }}"
pivx_bin_dir: "{{ pivx_install_dir }}/bin"
pivx_current_link: "/opt/pivx/current"     # symlink → active release
pivx_symlink_dir: "/usr/local/bin"          # individual binary symlinks
pivx_archive_url: "https://github.com/Liquid369/PIVX/releases/download/v{{ pivx_version }}/pivx-{{ pivx_version }}-x86_64-linux-gnu.tar.gz"
pivx_checksum: "sha256:b5c5d0991b2a3a97717d33089ec4065e9c0d9f861fd58c54333fd5bd1e12083c"  # 5.6.99-tn6.2, only checked on the URL path

# ---------------------------------------------------------------------------
# Sapling parameters
# ---------------------------------------------------------------------------
# PIVX requires Sapling zk-SNARK parameter files before pivxd will start.
# These are downloaded once per host (via get_url) to pivx_params_dir.
# Kept OUTSIDE /home because the pivxd systemd unit uses ProtectHome=true;
# pivx.conf points at this path via paramsdir=.
pivx_params_dir: "/var/lib/pivx/params"
# pivxd only loads sapling-spend and sapling-output, sprout-groth16 is
# zcashd only (725MB), dont add it.
pivx_sapling_params:
  - name: sapling-spend.params
    url: "https://download.z.cash/downloads/sapling-spend.params"
    checksum: "sha256:8e48ffd23abb3a5fd9c5589204f32d9c31285a04b78096ba40a79b75677efc13"
  - name: sapling-output.params
    url: "https://download.z.cash/downloads/sapling-output.params"
    checksum: "sha256:2f0ebbcbb9bb0bcffe95a397e7eba89c29eb4dde6191c339db88570e3f3fb0e4"

# ---------------------------------------------------------------------------
# PIVX network / chain identity
# ---------------------------------------------------------------------------
pivx_network: testnet
chain: testnet6

# ---------------------------------------------------------------------------
# Instance defaults — overridden per-instance in host_vars
# ---------------------------------------------------------------------------
pivx_user: pivx
pivx_group: pivx
pivx_base_datadir: /var/lib/pivx
pivx_base_logdir: /var/log/pivx
pivx_base_confdir: /etc/pivx

# Port base values.  Each instance increments by its index to avoid conflicts.
# Instance slot 0 = base ports; slot 1 = base+10; slot 2 = base+20
pivx_p2p_port_base: 51474       # testnet p2p default
pivx_rpc_port_base: 51478       # testnet rpc default

# ---------------------------------------------------------------------------
# Team ssh keys
# Managed by the common role, add or remove a line and rerun make bootstrap.
# Password auth is off fleet wide so this list is the only door.
# ---------------------------------------------------------------------------
ops_ssh_keys:
  - name: luke
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILZflFbb+iN4cUh4SwwABoMs95fz+TJ4a0atBytMtgig luke@lukehanslarsen.com"

# ---------------------------------------------------------------------------
# Systemd
# ---------------------------------------------------------------------------
pivx_systemd_service_template: "pivxd@.service"

# ---------------------------------------------------------------------------
# Monitoring / observability
# ---------------------------------------------------------------------------
prometheus_scrape_interval: 30s
node_exporter_port: 9100
process_exporter_port: 9256
vector_port: 8686                # Vector API / metrics port

# Monitoring host — the Prometheus/Grafana/Loki stack target
# (colocated on tn6-cb5 until a dedicated infra host is funded)
monitoring_host: tn6-cb5
loki_endpoint: "http://{{ hostvars['tn6-cb5']['ansible_host'] }}:3100"
prometheus_remote_write_url: ""  # optional; leave blank for local only

# ---------------------------------------------------------------------------
# Tor
# ---------------------------------------------------------------------------
tor_user: debian-tor
tor_hidden_service_base_dir: /var/lib/tor/pivx_hs
tor_socks_port: 9050

# ---------------------------------------------------------------------------
# Bootstrap mining settings
# Used by pivx_bootstrap_miner role and start_bootstrap_mining playbook.
#
# PIVX testnet starts with PoW mining until enough blocks accumulate for
# PoS consensus and then masternode activation prerequisites are met.
# ---------------------------------------------------------------------------
bootstrap_mining_enabled: false           # set true on miner hosts during Phase 2
# NOTE: there is no miningaddress conf option in this build. The miner role calls
# getnewaddress on the mining instance and passes it to generatetoaddress, so
# rewards land in that instance's own wallet. Sweep rewards from the seeder
# wallet after the PoW phase if needed.
# There is no thread setting: generatetoaddress takes nblocks and an address and
# nothing else, so a thread count would control nothing.

# Target block height before Phase 3 staking transition begins.
# CONFIRMED against chainparams.cpp (testnet):
#   consensus.vUpgrades[UPGRADE_POS].nActivationHeight = 201
# PoW is mined only up to this height - 1. Block 201 itself has to be staked,
# so the miner role stops one short on purpose.
mining_phase_target_height: 201

# ---------------------------------------------------------------------------
# Staking settings
# Enabled during Phase 3 on nodes that hold testnet coins.
# ---------------------------------------------------------------------------
staking_enabled: false                    # set true per-host once transition begins
staking_min_confirmations: 100            # nStakeMinDepth on testnet6

# ---------------------------------------------------------------------------
# Masternode / quorum settings
# CONFIRMED against src/chainparams.cpp on 2026_testnet6_llmq20:
#   LLMQ_20_60  (size 20, minSize 16, threshold 12)  <- testnet chainlocks
#   LLMQ_50_60  (size 50, minSize 40, threshold 30)
#   LLMQ_400_60 / LLMQ_400_85  (mainnet sizing, impossible on this fleet)
# llmqTypeChainLocks is LLMQ_20_60 from 5.6.99-tn6.2 onward. The 5.6.99-tn6
# binary predates it and used LLMQ_50_60, so mixed versions disagree on which
# quorum signs chainlocks. The whole fleet has to be on one or the other.
#
# minSize 16 is what makes cohort isolated DKG testable at all: IPv4 45,
# IPv6 50 and Tor 50 each clear it on their own, where minSize 40 left IPv4
# short. Timing measured at size 20 does not extrapolate to mainnet's 400,
# use it to prove IPv6 and Tor quorums function, not to predict production.
# ---------------------------------------------------------------------------
masternode_enabled: false                 # set true per-instance once MN reg is done
# legacy until UPGRADE_V6_0 (block 5000), deterministic after. Special txs are
# rejected before 5000 and legacy dies at 5000, so the ProRegTx wave has to be
# staged and fired at the cutover, not before.
masternode_mode: legacy                   # legacy | deterministic
v6_activation_height: 5000

# Staged activation heights, mirrors CTestNetParams on the 2026_testnet6
# branch. Kept here so the fleet can report what has activated and what is
# next. Update both together if chainparams changes.
upgrade_schedule:
  - {height: 201, name: POS}
  - {height: 225, name: POS_V2}
  - {height: 250, name: ZC}
  - {height: 275, name: ZC_V2}
  - {height: 300, name: BIP65}
  - {height: 350, name: ZC_PUBLIC}
  - {height: 400, name: V3_4}
  - {height: 450, name: V4_0}
  - {height: 500, name: V5_0}
  - {height: 550, name: V5_2}
  - {height: 600, name: V5_3}
  - {height: 650, name: V5_5}
  - {height: 700, name: V5_6}
  - {height: 5000, name: V6_0}
llmq_type: 1                              # LLMQ_50_60
quorum_size: 50                           # llmq50_60.size (minSize 40 to form)

# ---------------------------------------------------------------------------
# Chain reset / wipe settings
# Used by the wipe_chain playbook for complete testnet restarts.
# ---------------------------------------------------------------------------
chain_wipe_keep_wallet: true              # preserve wallet.dat across wipes
chain_wipe_keep_tor_keys: true            # preserve Tor HS private keys across wipes

