  - "ahznq5kwpd6xwxfggg2ooy545ts2f72l7flu3rbcyxoog7fjjjd5j7ad.onion:51474"
  - "u2gjinpoyfehafgl4ibmpkqxkuoz2gfw5zm5spirumjl2pyu5ghwzcad.onion:51474"

# ---------------------------------------------------------------------------
# Logging labels (common; instances add their own below)
# ---------------------------------------------------------------------------
log_labels:
  chain: "{{ chain }}"
  env: testnet6
  lifecycle_phase: "{{ lifecycle_phase }}"

# ---------------------------------------------------------------------------
# Ops
# ---------------------------------------------------------------------------
debug_bundle_local_dir: "{{ playbook_dir }}/../../debug_bundles"

# Minimum peers before considering an instance healthy
min_peer_count: 2
