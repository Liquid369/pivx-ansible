# PIVX Testnet6 — Active Inventory
#
# Current funded fleet (15 hosts):
#   - tn6-cb1..tn6-cb5    Contabo Cloud VPS 8 (2026): 8 vCPU / 24 GB
#   - tn6-cb6..tn6-cb10   Contabo Cloud VPS 6 (2026): 6 vCPU / 12 GB
#   - tn6-ovh1..tn6-ovh3  OVH Sydney: 8 vCPU / 31 GB / 1.8 TB
#   - tn6-ovh4..tn6-ovh5  OVH Gravelines FR: 8 vCPU / 31 GB / 437 GB
#   - tn6-cb1..tn6-cb3    also run colocated seed/bootstrap-miner instances
#   - tn6-cb5             also runs observer + monitoring stack
#
# Naming: cb = Contabo, ovh = OVH. The prefix is the provider, not a sequence,
# because provider-specific quirks matter (Contabo blocks direct L2 between
# its own VPS; OVH does not, and hands out /128 IPv6 instead of /64).
#
# Regions:
#   EU Nuremberg:  tn6-cb1, tn6-cb5, tn6-cb6, tn6-cb7, tn6-cb8
#   US St. Louis:  tn6-cb2, tn6-cb3, tn6-cb4
#   US Seattle:    tn6-cb9, tn6-cb10
#   AU Sydney:     tn6-ovh1, tn6-ovh2, tn6-ovh3   (OVH)
#   FR Gravelines: tn6-ovh4, tn6-ovh5             (OVH, eu-west-gr-a)
#
# Future expansion (forum proposal targets 15 hosts):
#   - The 2 OVH France hosts landed 2026-07-30, so the 15-host target is met;
#     budget allows more when funds do.
#     The layout scales by adding hosts with the same 6-instance slot scheme.
#
# Instance layout per masternode host:
#   Slot 0  v4-mn01   IPv4 #1   P2P 51474 / RPC 51478   MN-capable
#   Slot 1  v4-mn02   IPv4 #1*  P2P 51484 / RPC 51488   NOT MN-capable
#                     (*shares the host's single IPv4; unique ip:port still
#                     satisfied, but see the port rule below)
#   Slot 2  v6-mn03   IPv6 ::1  P2P 51474 / RPC 51498   MN-capable
#   Slot 3  v6-mn04   IPv6 ::2  P2P 51474 / RPC 51508   MN-capable
#   Slot 4  tor-mn05  Tor  #1   P2P 51514 / RPC 51518   MN-capable (onion:51474)
#   Slot 5  tor-mn06  Tor  #2   P2P 51524 / RPC 51528   MN-capable (onion:51474)
#
# Why the IPv6 slots sit on 51474 rather than 51494/51504:
# CMasternodeBroadcast::CheckDefaultPort (masternode.cpp:368) rejects any
# masternode whose announced port is not Params().GetDefaultPort(), which is
# 51474 on testnet. It is not gated on regtest, so it always applies here. Each
# IPv6 instance has its own address, so both can bind 51474 without colliding.
#
# That leaves 5 MN-capable instances per host, not 6. v4-mn02 shares the host's
# only IPv4, so it cannot also claim 51474 and can never be a masternode without
# a second IPv4 on the host. The Tor slots bind loopback on 51514/51524 but the
# hidden service publishes 51474, which is what gets announced.
#
# Exception: tn6-ovh4 keeps v6-mn04 on 51504 because OVH never routed its /64,
# so host_ipv6_2 == host_ipv6 there and both slots would collide on one address.
# That host has 4 MN-capable instances until the OVH ticket is resolved.
#
# Fleet MN capacity: 14 hosts x 5 + ovh4 x 4 = 74.
#
# Colocated seed/bootstrap hosts (cb1-cb3) and observer (cb5) add:
#   Slot 6  seed01/2/3 or obs01  IPv4  P2P 51534 / RPC 51538

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/tn6_ops_ed25519
    chain: testnet6
    pivx_network: testnet

  children:

    # -------------------------------------------------------------------------
    # Functional role groups
    # -------------------------------------------------------------------------
    masternodes:
      hosts:
        # --- Contabo Cloud VPS 8 class (5 hosts) -----------------------------
        tn6-cb1:
          ansible_host: 169.58.75.147
        tn6-cb2:
          ansible_host: 62.146.176.174
        tn6-cb3:
          ansible_host: 209.126.84.12
        tn6-cb4:
          ansible_host: 217.77.13.82
        tn6-cb5:
          ansible_host: 169.58.75.146

        # --- Contabo Cloud VPS 6 class (5 hosts) -----------------------------
        tn6-cb6:
          ansible_host: 169.58.75.144
        tn6-cb7:
          ansible_host: 169.58.75.143
        tn6-cb8:
          ansible_host: 169.58.75.142
        tn6-cb9:
          ansible_host: 62.146.173.20
        tn6-cb10:
          ansible_host: 94.72.121.81

        # --- OVH Sydney (3 hosts) --------------------------------------------
        tn6-ovh1:
          ansible_host: 139.99.130.196
        tn6-ovh2:
          ansible_host: 139.99.130.198
        tn6-ovh3:
          ansible_host: 139.99.130.199

        # --- OVH Gravelines FR (2 hosts) -------------------------------------
        tn6-ovh4:
          ansible_host: 79.137.66.163
        tn6-ovh5:
          ansible_host: 5.135.131.99

    # Colocated seed/bootstrap instances. These hosts are also masternode hosts.
    seeders:
      hosts:
        tn6-cb1:
        tn6-cb2:
        tn6-cb3:

    bootstrap_miners:
      hosts:
        tn6-cb1:
        tn6-cb2:
        tn6-cb3:

    # Observer + monitoring colocated on tn6-cb5 (no dedicated infra host yet).
    observers:
      hosts:
        tn6-cb5:

    monitoring:
      hosts:
        tn6-cb5:

    # Block explorer box. Runs the PRODUCTION mainnet explorer (hand-managed,
    # never touched by ansible) plus, under our management, a testnet6 pivxd +
    # a second rusty-blox instance. Only deploy_explorer.yml targets this group.
    # It is in the inventory so prometheus scrapes it, but the fleet bootstrap
    # and pivx plays exclude it by targeting explicit role groups.
    explorers:
      hosts:
        tn6-explorer01:
          ansible_host: 62.84.185.233

    # -------------------------------------------------------------------------
    # Provider groups
    # -------------------------------------------------------------------------
    provider_contabo:
      hosts:
        tn6-cb1:
        tn6-cb2:
        tn6-cb3:
        tn6-cb4:
        tn6-cb5:
        tn6-cb6:
        tn6-cb7:
        tn6-cb8:
        tn6-cb9:
        tn6-cb10:

    provider_ovh:
      hosts:
        tn6-ovh1:
        tn6-ovh2:
        tn6-ovh3:
        tn6-ovh4:
        tn6-ovh5:

    # -------------------------------------------------------------------------
    # Protocol cohort groups
    # Cohort stop/start targets filter per instance by `cohort`.
    # netem targets are host-level and affect every process on matching hosts.
    # -------------------------------------------------------------------------
    cohort_ipv4:
      children:
        masternodes:
        seeders:

    cohort_ipv6:
      children:
        masternodes:

    cohort_tor:
      children:
        masternodes:

    # -------------------------------------------------------------------------
    # Chaos groups
    # -------------------------------------------------------------------------
    chaos_contabo:
      children:
        provider_contabo:

    chaos_ovh:
      children:
        provider_ovh:
