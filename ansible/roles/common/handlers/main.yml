---
# roles/common/handlers/main.yml

- name: restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: netplan apply
  ansible.builtin.command: netplan apply

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted
