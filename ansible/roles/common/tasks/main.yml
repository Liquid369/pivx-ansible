---
# roles/common/tasks/main.yml
# Bootstrap tasks applied to every host in the fleet.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - htop
      - iotop
      - net-tools
      - iproute2
      - ufw
      - fail2ban
      - chrony
      - logrotate
      - lsb-release
      - ca-certificates
      - gnupg
      - python3-pip
      - jq
      - bc
    state: present

- name: Configure chrony (NTP)
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chrony

- name: Enable and start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Create pivx service group
  ansible.builtin.group:
    name: "{{ pivx_group }}"
    system: true
    state: present

- name: Create pivx service user
  ansible.builtin.user:
    name: "{{ pivx_user }}"
    group: "{{ pivx_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/pivx
    create_home: true
    comment: "PIVX daemon service account"

- name: Create base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pivx_user }}"
    group: "{{ pivx_group }}"
    mode: "0750"
  loop:
    - "{{ pivx_base_datadir }}"
    - "{{ pivx_base_logdir }}"
    - "{{ pivx_base_confdir }}"

- name: Configure sysctl for network tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: net.core.somaxconn,         value: "1024" }
    - { key: net.ipv4.tcp_max_syn_backlog, value: "1024" }
    - { key: vm.swappiness,               value: "10" }

- name: Disable IPv6 if not needed (skip on IPv6 hosts)
  # IPv6 hosts are identified by having host_ipv6 set - do NOT disable IPv6 there
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.disable_ipv6
    value: "0"      # keep enabled everywhere: IPv6 masternodes need it
    state: present
    reload: true

- name: Configure secondary IPv6 address (netplan drop-in)
  # Contabo images configure only ::1 from the /64. The v6-mn04 instance
  # binds ::2, which we persist here and activate via `netplan apply`.
  ansible.builtin.copy:
    dest: /etc/netplan/60-pivx-ipv6.yaml
    content: |
      network:
        version: 2
        ethernets:
          {{ ansible_default_ipv4.interface }}:
            addresses:
              - "{{ host_ipv6_2 }}/64"
    owner: root
    group: root
    mode: "0600"
  when:
    - host_ipv6_2 is defined
    - host_ipv6_2 != (host_ipv6 | default(''))
  notify: netplan apply

# Contabo hands out a /17, so fleet hosts in the same /24 look on-link and the
# kernel tries direct L2 delivery, which Contabo blocks between VPS (ARP goes
# INCOMPLETE). This breaks same-subnet traffic like prometheus scraping the EU
# node_exporters. Route those peers via the gateway instead. Peers in other
# subnets already route through the gateway and are unaffected.
# ponytail: matches same /24, our EU hosts are all 169.58.75.x. If a future EU
# host lands elsewhere in the /17, widen this match.
- name: Find same-subnet fleet peers (Contabo blocks direct L2)
  ansible.builtin.set_fact:
    l2_isolated_peers: "{{ groups['provider_contabo'] | difference([inventory_hostname]) | map('extract', hostvars, 'ansible_host') | select('search', '^' + (ansible_host.split('.')[0:3] | join('.')).replace('.', '[.]') + '[.]') | list }}"

- name: Route same-subnet peers via the gateway
  ansible.builtin.copy:
    dest: /etc/netplan/61-pivx-routes.yaml
    content: |
      network:
        version: 2
        ethernets:
          {{ ansible_default_ipv4.interface }}:
            routes:
      {% for ip in l2_isolated_peers %}
              - to: {{ ip }}/32
                via: {{ ansible_default_ipv4.gateway }}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  when: l2_isolated_peers | length > 0
  notify: netplan apply

- name: Harden sshd to key-only login
  # 00- prefix: sshd first-match-wins, must sort before cloud-init's 50-*.conf
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-tn6-hardening.conf
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
    owner: root
    group: root
    mode: "0644"
  notify: restart sshd

- name: Add team ssh keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ item.key }}"
    comment: "{{ item.name }}"
    state: present
  loop: "{{ ops_ssh_keys | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# pivxd logs to console so journald can feed vector/loki. rsyslog was
# mirroring the whole journal into /var/log/syslog with no size cap
# (215GB during the miner loop incident) while journald caps itself.
- name: Disable rsyslog (journald is canonical, rsyslog duplicates unbounded)
  ansible.builtin.systemd:
    name: rsyslog
    state: stopped
    enabled: false
    masked: true
  failed_when: false    # image variants without rsyslog

- name: Remove legacy rsyslog output files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/log/syslog
    - /var/log/syslog.1

# add allow rules before enabling ufw so a dropped connection mid-play
# cant lock us out.
- name: ufw - allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: ufw - allow PIVX p2p ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_pivx_ports | default([]) }}"

- name: Configure ufw defaults
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Configure logrotate for pivx logs
  ansible.builtin.template:
    src: logrotate-pivx.j2
    dest: /etc/logrotate.d/pivx
    owner: root
    group: root
    mode: "0644"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ host_label }}"

- name: Configure /etc/hosts entry for self
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127.0.1.1"
    line: "127.0.1.1  {{ host_label }}"
