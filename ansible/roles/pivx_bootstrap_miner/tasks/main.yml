---
# roles/pivx_bootstrap_miner/tasks/main.yml
#
# Mines the PoW window with generatetoaddress. This build has neither
# setgenerate nor getmininginfo, the only mining RPC is:
#
#   generatetoaddress nblocks "address"
#
# which mines synchronously and returns the block hashes.
#
# Mining runs on ONE instance. Several seeders racing on the same height fork
# the chain constantly, and those reorgs are not what we are trying to test.
# The other seeders just sync.
#
# PoW only reaches mining_phase_target_height - 1. UPGRADE_POS activates at
# 201 so block 201 has to be staked, not mined.

- name: Gather mining-enabled instances on this host
  ansible.builtin.set_fact:
    mining_instances: >-
      {{ pivx_instances | selectattr('enabled', 'equalto', true)
                        | selectattr('mining_enabled', 'defined')
                        | selectattr('mining_enabled', 'equalto', true)
                        | list }}

- name: Nothing to do on this host
  ansible.builtin.meta: end_host
  when: mining_instances | length == 0

- name: Refuse to mine from more than one instance on a host
  ansible.builtin.assert:
    that: mining_instances | length == 1
    msg: >-
      {{ inventory_hostname }} has {{ mining_instances | length }} instances with
      mining_enabled. Concurrent miners fork the chain. Leave exactly one.

- name: Set the miner instance
  ansible.builtin.set_fact:
    miner: "{{ mining_instances | first }}"

- name: Read current height
  ansible.builtin.command:
    argv:
      - "/opt/pivx/current/bin/pivx-cli"
      - "-conf={{ miner.confdir }}/pivx.conf"
      - "getblockcount"
  register: height_now
  changed_when: false

- name: Work out how many blocks are left
  ansible.builtin.set_fact:
    pow_last_block: "{{ (mining_phase_target_height | int) - 1 }}"
    blocks_needed: >-
      {{ [((mining_phase_target_height | int) - 1) - (height_now.stdout | trim | int), 0] | max }}

- name: Report
  ansible.builtin.debug:
    msg: >-
      {{ miner.name }} at height {{ height_now.stdout | trim }},
      PoW ends at {{ pow_last_block }},
      {{ blocks_needed }} blocks to mine

- name: Already at the target
  ansible.builtin.meta: end_host
  when: blocks_needed | int == 0

- name: Get a mining address from the miner wallet
  # Rewards land here, so it has to be an address this instance controls. The
  # collateral gets cut from this same wallet later.
  ansible.builtin.command:
    argv:
      - "/opt/pivx/current/bin/pivx-cli"
      - "-conf={{ miner.confdir }}/pivx.conf"
      - "getnewaddress"
      - "bootstrap-mining"
  register: mine_addr
  changed_when: false

- name: Mine the remaining blocks
  # generatetoaddress blocks until it returns. Batched so a single RPC call
  # is not left hanging for the whole window, and so a partial run can be
  # resumed by rerunning the play.
  #
  # The last batch mines only the remainder, never a full batch. Mining a fixed
  # bootstrap_mining_batch every pass overshoots whenever blocks_needed is not a
  # multiple of it: from height 1 that lands on 201, and 201 is exactly the block
  # UPGRADE_POS requires to be staked rather than mined.
  #
  # A batch can outlast the RPC client. Difficulty retargets upward fast here
  # because we mine far under target spacing — it went from ~22s to ~170s per
  # block inside the first 70 blocks — so pivx-cli eventually returns
  #   error: couldn't connect to server: timeout reached
  # and exits non-zero. The daemon does NOT stop: it finishes the batch it was
  # asked for. That was verified — a run whose client died at height 59 kept
  # going and landed on the requested 70 with nothing attached.
  #
  # So a failed client call is not a failed batch, and this must not abort the
  # play. Note -rpcclienttimeout=0 does not help: despite the help text saying 0
  # means no timeout, it errored after 50s. The wait task below is what actually
  # establishes whether the blocks got mined.
  ansible.builtin.command:
    argv:
      - "/opt/pivx/current/bin/pivx-cli"
      - "-conf={{ miner.confdir }}/pivx.conf"
      - "generatetoaddress"
      - "{{ [bootstrap_mining_batch | default(25) | int,
             (blocks_needed | int) - (item * (bootstrap_mining_batch | default(25) | int))] | min }}"
      - "{{ mine_addr.stdout | trim }}"
  register: mine_batch
  changed_when: true
  failed_when: false
  loop: "{{ range(0, ((blocks_needed | int) / (bootstrap_mining_batch | default(25) | int)) | round(0, 'ceil') | int) | list }}"
  loop_control:
    label: "batch {{ item + 1 }}"

- name: Wait for the chain to reach the PoW target
  # Polls instead of trusting the batch calls to have returned cleanly, because
  # the daemon keeps mining after a client timeout. Generous retry budget: block
  # spacing climbs as difficulty retargets, so late blocks take minutes each.
  ansible.builtin.command:
    argv:
      - "/opt/pivx/current/bin/pivx-cli"
      - "-conf={{ miner.confdir }}/pivx.conf"
      - "getblockcount"
  register: mine_wait
  changed_when: false
  until: (mine_wait.stdout | trim | int) >= (pow_last_block | int)
  retries: "{{ bootstrap_mining_wait_retries | default(120) }}"
  delay: "{{ bootstrap_mining_wait_delay | default(30) }}"
  failed_when: false

- name: Confirm the height after mining
  ansible.builtin.command:
    argv:
      - "/opt/pivx/current/bin/pivx-cli"
      - "-conf={{ miner.confdir }}/pivx.conf"
      - "getblockcount"
  register: height_after
  changed_when: false

- name: Result
  ansible.builtin.debug:
    msg: >-
      {{ miner.name }} now at height {{ height_after.stdout | trim }}
      (PoW target {{ pow_last_block }}).
      {% if (height_after.stdout | trim | int) < (pow_last_block | int) %}
      Short of target, rerun make start-bootstrap-mining.
      {% else %}
      PoW window complete. Each coinbase matures 15 blocks after the block that made it.
      {% endif %}
