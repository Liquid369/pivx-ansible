---
# roles/pivx_bootstrap_miner/tasks/stop_mining.yml
#
# Confirms PoW mining is not active. Called from
# playbooks/lifecycle/stop_bootstrap_mining.yml.
#
# There is no runtime mining to switch off. This build has no setgenerate and
# no background miner thread reachable over RPC — generatetoaddress is the only
# mining call and it runs synchronously, so mining only happens while
# `make start-bootstrap-mining` is executing and has already stopped by the time
# that play returns. pivx.conf also pins gen=0 (the built-in miner loop is what
# filled the seeder disks before the miner fix).
#
# So this checks the two things that could still leave a miner running and
# reports the height reached, rather than issuing a stop that has no meaning.

- name: Gather mining-enabled instances on this host
  ansible.builtin.set_fact:
    mining_instances: >-
      {{ pivx_instances | selectattr('enabled', 'equalto', true)
                        | selectattr('mining_enabled', 'defined')
                        | selectattr('mining_enabled', 'equalto', true)
                        | list }}

- name: Nothing mining-enabled on this host
  ansible.builtin.meta: end_host
  when: mining_instances | length == 0

- name: Check the built-in miner loop is disabled in pivx.conf
  ansible.builtin.command:
    argv:
      - grep
      - -c
      - "^gen=1"
      - "{{ item.confdir }}/pivx.conf"
  loop: "{{ mining_instances }}"
  loop_control:
    label: "{{ item.name }}"
  register: gen_check
  changed_when: false
  failed_when: false

- name: Fail if any miner still has gen=1
  ansible.builtin.assert:
    that: item.stdout | trim | int == 0
    msg: >-
      {{ item.item.name }} still has gen=1 in pivx.conf. Set
      lifecycle_phase=pos_transition and re-run `make deploy-pivx` to regenerate
      the config with gen=0, otherwise it keeps mining after the PoS cutover.
  loop: "{{ gen_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Report the height reached
  ansible.builtin.command:
    argv:
      - "/opt/pivx/current/bin/pivx-cli"
      - "-conf={{ item.confdir }}/pivx.conf"
      - "getblockcount"
  loop: "{{ mining_instances }}"
  loop_control:
    label: "{{ item.name }}"
  register: miner_height
  changed_when: false

- name: Show miner state
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }} at height {{ item.stdout | trim }}, gen=0, no runtime
      miner to stop.
  loop: "{{ miner_height.results }}"
  loop_control:
    label: "{{ item.item.name }}"
