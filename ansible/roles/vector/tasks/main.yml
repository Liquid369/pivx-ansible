---
# roles/vector/tasks/main.yml
# Installs Vector log shipper and configures journal + file scraping
# for all PIVX instances on this host.
#
# Vector chosen over Promtail because:
#   - Single binary, richer transforms, active development
#   - Native journald source (no extra dependencies)
#   - VRL (Vector Remap Language) for structured log parsing
#   - Better memory profile for multi-instance hosts

- name: Set Vector version default
  ansible.builtin.set_fact:
    _vector_version: "{{ vector_version | default('0.37.0') }}"

- name: Download Vector .deb package
  ansible.builtin.get_url:
    # packages.timber.io was decommissioned after Datadog acquired Vector
    url: https://github.com/vectordotdev/vector/releases/download/v{{ _vector_version }}/vector_{{ _vector_version }}-1_amd64.deb
    dest: "/tmp/vector_{{ _vector_version }}_amd64.deb"
    # set vector_checksum ("sha256:<hash>") to verify; empty skips
    checksum: "{{ vector_checksum | default(omit, true) }}"
    mode: "0644"

- name: Install Vector .deb
  ansible.builtin.apt:
    deb: "/tmp/vector_{{ _vector_version }}_amd64.deb"
    state: present

- name: Create Vector config directory
  ansible.builtin.file:
    path: /etc/vector
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write Vector main config
  ansible.builtin.template:
    src: vector.toml.j2
    dest: /etc/vector/vector.toml
    owner: root
    group: root
    mode: "0644"
  notify: restart vector

# The deb package ships /etc/vector/vector.yaml (a demo_logs -> console sample)
# and, with no config flag set, vector loads THAT instead of our vector.toml,
# so nothing reaches Loki. Point vector at our config and drop the sample.
- name: Point Vector at our config
  ansible.builtin.copy:
    dest: /etc/default/vector
    content: "VECTOR_CONFIG=/etc/vector/vector.toml\n"
    owner: root
    group: root
    mode: "0644"
  notify: restart vector

- name: Remove packaged demo config
  ansible.builtin.file:
    path: /etc/vector/vector.yaml
    state: absent
  notify: restart vector

- name: ufw - allow Vector API (from monitoring host only)
  community.general.ufw:
    rule: allow
    src: "{{ hostvars[monitoring_host]['ansible_host'] }}"
    port: "{{ vector_port }}"
    proto: tcp

- name: Enable and start Vector
  ansible.builtin.service:
    name: vector
    state: started
    enabled: true
