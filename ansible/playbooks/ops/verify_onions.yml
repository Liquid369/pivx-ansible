---
# playbooks/ops/verify_onions.yml
# Diff the onion addresses in host_vars against what Tor actually generated.
# Read-only.
#
#   make verify-onions
#
# This exists because config can be structurally valid and still factually
# wrong about the network, which no service check catches. Three separate bugs
# came from that: a torrc publishing the instance port instead of the network
# default, externalip advertising the local port instead of the public one,
# and host_vars generated by copying another host's file, which carried its
# onion addresses along with it. In every case the daemons ran happily and
# peered, while announcing an address that was not theirs.
#
# Run after adding a host, after any provider reinstall (Tor regenerates keys,
# so the old addresses are gone), and before starting masternodes.

- name: Verify onion addresses match reality
  hosts: masternodes
  become: true
  gather_facts: false

  tasks:
    - name: Read the onion hostname Tor generated for each tor instance
      ansible.builtin.slurp:
        src: "{{ item.onion_service_dir }}/hostname"
      register: onion_files
      failed_when: false
      loop: >-
        {{ pivx_instances | selectattr('enabled', 'defined') | selectattr('enabled')
           | selectattr('protocol_class', 'equalto', 'tor') | list }}
      loop_control:
        label: "{{ item.name }}"

    - name: Compare against host_vars
      ansible.builtin.set_fact:
        onion_mismatches: >-
          {{ onion_mismatches | default([]) + [
               {
                 'instance': item.item.name,
                 'configured': item.item.onion_address | default(''),
                 'actual': (item.content | default('') | b64decode | trim)
               }
             ] }}
      when:
        - item.content is defined
        - (item.content | b64decode | trim) != (item.item.onion_address | default(''))
      loop: "{{ onion_files.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Report instances whose Tor directory could not be read
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }}: no hostname file at {{ item.item.onion_service_dir }}
          — Tor has not generated it yet, run make deploy-tor
      when: item.content is not defined
      loop: "{{ onion_files.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Report mismatches
      ansible.builtin.fail:
        msg: |
          {{ inventory_hostname }} has {{ onion_mismatches | length }} onion address mismatch(es).
          host_vars does not match what Tor generated. These instances announce
          an address that is not theirs.
          {% for m in onion_mismatches %}
            {{ m.instance }}
              host_vars: {{ m.configured | default('(empty)', true) }}
              actual:    {{ m.actual }}
          {% endfor %}
          Fix host_vars to the actual values, then run make deploy-pivx.
      when: onion_mismatches | default([]) | length > 0

    - name: All good
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: all tor instances match their generated onion addresses"
      when: onion_mismatches | default([]) | length == 0
