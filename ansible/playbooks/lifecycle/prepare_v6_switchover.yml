---
# playbooks/lifecycle/prepare_v6_switchover.yml
# Generate the BLS operator keys every masternode needs at v6 and write a
# registration worksheet. Run this well before block 5000.
#
#   make prepare-switchover
#
# Nothing here touches the chain or the running nodes. It only collects the
# keys and the facts a ProRegTx needs, because at 5000 legacy masternodes stop
# counting and there is no way to pre-submit the registrations.

- name: Prepare v6 switchover
  hosts: masternodes
  become: true
  gather_facts: false

  tasks:
    - name: Generate a BLS keypair per masternode instance
      # generateblskeypair is pure keygen, it does not touch the wallet, so
      # rerunning makes new keys. Skip instances that already have one.
      ansible.builtin.shell: |
        set -o pipefail
        /usr/local/bin/pivx-cli -conf={{ item.confdir }}/pivx.conf generateblskeypair
      args:
        executable: /bin/bash
      register: bls_out
      changed_when: false
      when: item.bls_operator_key | default('REPLACE_ME') in ['', 'REPLACE_ME']
      loop: >-
        {{ pivx_instances | selectattr('enabled', 'defined') | selectattr('enabled')
           | selectattr('role', 'equalto', 'masternode') | list }}
      loop_control:
        label: "{{ item.name }}"

    - name: Collect the registration facts
      ansible.builtin.set_fact:
        mn_rows: >-
          {{ mn_rows | default([]) + [{
               'instance': item.item.name,
               'host': inventory_hostname,
               'ipport': (item.item.external_ip | default('')) ~ ':' ~ (item.item.p2p_port | default('')),
               'protocol': item.item.protocol_class | default(''),
               'bls_public': (item.stdout | default('{}') | from_json).public | default('SKIPPED'),
               'bls_secret': (item.stdout | default('{}') | from_json).secret | default('SKIPPED')
             }] }}
      loop: "{{ bls_out.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stdout is defined

    - name: Write the worksheet to the control machine
      ansible.builtin.copy:
        content: |
          # v6 switchover worksheet for {{ inventory_hostname }}
          # Generated by prepare_v6_switchover.yml. Contains SECRET keys.
          #
          # Put bls_secret into bls_operator_key in host_vars for the instance.
          # Give bls_public to protx_register along with the collateral outpoint.
          #
          # protx_register "collateralHash" collateralIndex "ipAndPort" \
          #     "ownerAddress" "operatorPubKey" "votingAddress" "payoutAddress"
          #
          # Collateral is whatever 10000 PIV output already backs the legacy
          # masternode. It is reused as is, no need to move it.
          {% for r in mn_rows | default([]) %}

          [{{ r.instance }}]
          ipport      = {{ r.ipport }}
          protocol    = {{ r.protocol }}
          bls_public  = {{ r.bls_public }}
          bls_secret  = {{ r.bls_secret }}
          collateral  = FILL IN txid:index
          owner_addr  = FILL IN
          payout_addr = FILL IN
          {% endfor %}
        dest: "{{ playbook_dir }}/../../../switchover/{{ inventory_hostname }}.txt"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: mn_rows | default([]) | length > 0

    - name: Where the worksheets landed
      ansible.builtin.debug:
        msg: >-
          {{ mn_rows | default([]) | length }} keypairs for {{ inventory_hostname }}
          written to switchover/{{ inventory_hostname }}.txt (gitignored, contains secrets)
      run_once: false
