---
# playbooks/lifecycle/create_collateral.yml
# Cut exact masternode collateral outputs on a seeder wallet, lock them, and
# record the outpoints for the ProRegTx worksheet.
#
#   make create-collateral COUNT=60
#   make create-collateral COUNT=60 COLLATERAL_HOST=tn6-cb1 DRY_RUN=true
#
# One sendmany with COUNT outputs of exactly 10000 PIV. Exact matters: the
# ProRegTx collateral check rejects anything that is not nMNCollateralAmt, and
# getmasternodeoutputs only reports outputs of that size.
#
# The same outputs serve the legacy masternodes now and the ProRegTx at v6,
# so they are locked immediately. Staking or a consolidation sweep spending a
# collateral would silently drop a masternode.

- name: Create masternode collateral
  hosts: "{{ collateral_host | default('seeders[0]') }}"
  become: true
  gather_facts: false

  vars:
    collateral_amount: 10000
    seed_conf: "/etc/pivx/{{ collateral_instance }}/pivx.conf"
    lock_helper: /root/.collateral_lock.py

  tasks:
    - name: Require a count
      ansible.builtin.assert:
        that:
          - collateral_count is defined
          - collateral_count | int > 0
        msg: "Set COUNT=<n>"

    - name: Pick the seeder instance on this host
      ansible.builtin.set_fact:
        collateral_instance: >-
          {{ (pivx_instances | selectattr('role', 'equalto', 'seeder') | list | first).name }}

    - name: Stage the collateral lock helper
      ansible.builtin.copy:
        dest: "{{ lock_helper }}"
        mode: "0700"
        content: |
          #!/usr/bin/env python3
          """Lock every masternode collateral output that is not already locked.

          lockunspent validates the whole batch before locking anything and
          rejects the call if any single outpoint is already locked ("Invalid
          parameter, output already locked"), so re-sending the full list locks
          nothing at all. -mnconflock re-locks masternode.conf collateral on
          every startup, which makes that overlap the normal case rather than an
          edge case. Send only the difference.
          """
          import json
          import subprocess
          import sys

          CLI = ["/usr/local/bin/pivx-cli", "-conf=" + sys.argv[1]]


          def cli(*args):
              r = subprocess.run(CLI + list(args), capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit("pivx-cli %s failed: %s" % (args[0], r.stderr.strip()))
              return json.loads(r.stdout) if r.stdout.strip() else None


          def locked():
              # listlockunspent returns {"transparent": [...]}, not a bare array.
              got = cli("listlockunspent") or {}
              return {(o["txid"], o["vout"]) for o in got.get("transparent", [])}


          collateral = {(o["txhash"], o["outputidx"])
                        for o in (cli("getmasternodeoutputs") or [])}
          missing = sorted(collateral - locked())
          print("collateral=%d to_lock=%d" % (len(collateral), len(missing)))

          if missing:
              cli("lockunspent", "false", "true",
                  json.dumps([{"txid": t, "vout": v} for t, v in missing]))

          # Prove it took. A silent no-op here is what lets a later sendmany
          # select a collateral as an input and destroy a masternode.
          still = collateral - locked()
          if still:
              sys.exit("ERROR: %d collateral outputs still unlocked" % len(still))
          print("locked=%d" % len(collateral))

    - name: Lock any collateral that already exists before spending anything
      # sendmany picks its own inputs, and lockunspent locks live only in
      # memory. Any restart since the last run leaves earlier collateral
      # spendable and the next sendmany takes it as input. That is how six
      # outputs were destroyed during the binary upgrade.
      ansible.builtin.command: "{{ lock_helper }} {{ seed_conf }}"
      register: prelock
      changed_when: "'to_lock=0' not in prelock.stdout"

    - name: Show what the pre-lock did
      ansible.builtin.debug:
        msg: "pre-lock: {{ prelock.stdout_lines | join(', ') }}"

    - name: Read wallet state
      ansible.builtin.shell: |
        set -o pipefail
        C="/usr/local/bin/pivx-cli -conf={{ seed_conf }}"
        # getbalance counts locked coins, which sendmany can never select. Once
        # the collateral above is locked that overstates the usable balance by
        # 10000 per masternode, so a wallet with nothing actually spendable
        # still clears the check below and the sendmany then fails on
        # insufficient funds. listunspent already excludes locked outputs.
        $C listunspent | python3 -c '
        import sys, json
        print("spendable=%.8f" % sum(x["amount"] for x in json.load(sys.stdin)))
        '
        $C getmasternodeoutputs | python3 -c '
        import sys, json
        print("existing=%d" % len(json.load(sys.stdin)))
        '
      args:
        executable: /bin/bash
      register: wallet
      changed_when: false

    - name: Parse
      ansible.builtin.set_fact:
        wal_balance: "{{ (wallet.stdout_lines[0] | split('='))[1] | float }}"
        wal_existing: "{{ (wallet.stdout_lines[1] | split('='))[1] | int }}"

    - name: Show the plan
      ansible.builtin.debug:
        msg: >-
          {{ collateral_instance }}: {{ wal_balance }} PIV spendable
          (locked collateral excluded), {{ wal_existing }} collateral outputs
          already present, asking for {{ collateral_count }} more
          ({{ collateral_count | int * collateral_amount | int }} PIV)

    - name: Refuse if the wallet cannot cover it
      ansible.builtin.assert:
        that: wal_balance | float >= (collateral_count | int * collateral_amount | int) + 1
        msg: >-
          Need {{ collateral_count | int * collateral_amount | int }} PIV plus fee,
          only {{ wal_balance }} is spendable. The {{ wal_existing }} locked
          collateral outputs do not count toward this. Mine more blocks or wait
          for the rewards to mature.

    - name: Stop here on a dry run
      ansible.builtin.meta: end_play
      when: dry_run | default(false) | bool

    - name: Cut the collateral outputs
      # One tx, COUNT outputs of exactly 10000, change back to the wallet.
      ansible.builtin.shell: |
        set -o pipefail
        C="/usr/local/bin/pivx-cli -conf={{ seed_conf }}"
        PAYLOAD=$(for i in $(seq 1 {{ collateral_count }}); do
          $C getnewaddress "collateral-$i"
        done | python3 -c '
        import sys, json
        addrs = [l.strip() for l in sys.stdin if l.strip()]
        print(json.dumps({a: {{ collateral_amount }} for a in addrs}))
        ')
        $C sendmany "" "$PAYLOAD"
      args:
        executable: /bin/bash
      register: sendmany_out

    - name: Show the funding txid
      ansible.builtin.debug:
        msg: "collateral funding tx: {{ sendmany_out.stdout | trim }}"

    - name: Wait for it to confirm and enumerate the outpoints
      ansible.builtin.shell: |
        set -o pipefail
        C="/usr/local/bin/pivx-cli -conf={{ seed_conf }}"
        for i in $(seq 1 60); do
          n=$($C getmasternodeoutputs | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          [ "$n" -ge "{{ collateral_count }}" ] && break
          sleep 10
        done
        $C getmasternodeoutputs
      args:
        executable: /bin/bash
      register: outputs_raw
      changed_when: false

    - name: Lock them so staking and sweeps cannot spend them
      # Same helper as the pre-lock: it re-reads the wallet and locks only what
      # is not locked yet. Passing the full list here is what used to fail, as
      # the outputs locked before the sendmany are still locked now.
      ansible.builtin.command: "{{ lock_helper }} {{ seed_conf }}"
      register: lock_out
      changed_when: "'to_lock=0' not in lock_out.stdout"

    - name: Show what was locked
      ansible.builtin.debug:
        msg: "lock: {{ lock_out.stdout_lines | join(', ') }}"

    # switchover/ is gitignored (.gitignore:51) — the worksheet is working state
    # that must never be committed. copy: does not create the parent, so make it
    # here, or the play fails after the collateral is already cut on-chain.
    - name: Ensure the switchover worksheet directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../../switchover"
        state: directory
        mode: "0750"
      delegate_to: localhost
      become: false

    - name: Write the outpoint list for the switchover worksheet
      ansible.builtin.copy:
        content: |
          # masternode collateral outpoints
          # host {{ inventory_hostname }} wallet {{ collateral_instance }}
          # funding tx {{ sendmany_out.stdout | trim }}
          #
          # These are locked in the wallet and back the legacy masternodes.
          #
          # DO NOT reuse one of these as ProRegTx collateral while the legacy
          # masternode on it is still running. An earlier version of this header
          # said they could be reused as is, which is wrong and would get nodes
          # banned: a DMN on the same outpoint shadows the legacy entry, because
          # budgetmanager and masternode-payments consult GetMNByCollateral first
          # and return inside the hit, so the signature is checked against
          # keyIDVoting instead of pubKeyMasternode and a node still signing as
          # legacy takes DoS(100, "bad-mvote-sig"). CheckProRegTx does not
          # compare the collateral against mapMasternodes, so nothing rejects it.
          # It also double counts through CountEnabled, which sums both lists.
          # See prepare_v6_switchover.yml for the full reasoning.
          #
          # Cut fresh outputs for the ProRegTx wave, or retire the legacy
          # masternode on an outpoint before reusing it.
          #
          # protx_register "<txhash>" <outputidx> "<ip:port>" "<owner>" \
          #     "<blsPublic>" "<voting>" "<payout>"
          {% for o in (outputs_raw.stdout | from_json) %}
          {{ o.txhash }}:{{ o.outputidx }}
          {% endfor %}
        dest: "{{ playbook_dir }}/../../../switchover/collateral-{{ inventory_hostname }}.txt"
        mode: "0640"
      delegate_to: localhost
      become: false

    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ (outputs_raw.stdout | from_json) | length }} collateral outputs ready and locked.
          Outpoints in switchover/collateral-{{ inventory_hostname }}.txt.
          Unlock one with: pivx-cli lockunspent true true '[{"txid":"..","vout":N}]'
