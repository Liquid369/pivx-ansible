---
# playbooks/deploy_monitoring.yml
# Deploys the full observability stack to the monitoring group host,
# and installs node_exporter + Vector on every fleet host.

# Explicit fleet groups, NOT `all`: the explorers group is a production box
# managed only by deploy_explorer.yml (it installs its own exporters there).
- name: Install exporters and Vector on all fleet hosts
  hosts: masternodes:seeders:observers:monitoring
  become: true
  gather_facts: true

  roles:
    - node_exporter
    - process_exporter
    - vector

- name: Deploy Prometheus, Loki, Grafana, Alertmanager on monitoring host
  hosts: monitoring
  become: true
  gather_facts: true

  roles:
    - prometheus
    - loki
    - grafana
    - alertmanager
