---
# playbooks/deploy_monitoring.yml
# Deploys the full observability stack to the monitoring group host,
# and installs node_exporter + Vector on every fleet host.

# Explicit fleet groups, NOT `all`: the explorers group is a production box
# managed only by deploy_explorer.yml (it installs its own exporters there).
- name: Install exporters and Vector on all fleet hosts
  hosts: masternodes:seeders:observers:monitoring
  become: true
  gather_facts: true

  roles:
    - node_exporter
    - process_exporter
    # Chain state (height, tip fingerprint, peers, mempool, masternode counts)
    # written to node_exporter's textfile dir. Ordered after node_exporter so
    # the collector directory exists before the timer first fires.
    - pivx_metrics
    - vector

- name: Deploy Prometheus, Loki, Grafana, Alertmanager on monitoring host
  hosts: monitoring
  become: true
  gather_facts: true

  roles:
    - prometheus
    - loki
    - grafana
    # nginx on 443 fronting Grafana for Cloudflare. Ordered after grafana so
    # the backend exists before the proxy starts pointing at it. Cloudflare
    # cannot proxy port 3000, so this is required, not optional.
    - role: grafana_proxy
      when: grafana_behind_proxy | default(false)
    - alertmanager
